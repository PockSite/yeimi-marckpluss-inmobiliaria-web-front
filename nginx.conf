server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Negociacion de contenido markdown (acceptmarkdown.com).
    # $mp_md vale 1 cuando el cliente pide text/markdown en el Accept.
    set $mp_md 0;
    if ($http_accept ~* "text/markdown") {
        set $mp_md 1;
    }

    # Portada
    location = / {
        add_header Vary "Accept, Accept-Encoding" always;
        if ($mp_md = 1) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    # Paginas estaticas de confianza, con URL limpia y variante markdown
    location = /about {
        add_header Vary "Accept, Accept-Encoding" always;
        if ($mp_md = 1) {
            rewrite ^ /about.md last;
        }
        try_files /about.html =404;
    }

    location = /contact {
        add_header Vary "Accept, Accept-Encoding" always;
        if ($mp_md = 1) {
            rewrite ^ /contact.md last;
        }
        try_files /contact.html =404;
    }

    location = /privacy {
        add_header Vary "Accept, Accept-Encoding" always;
        if ($mp_md = 1) {
            rewrite ^ /privacy.md last;
        }
        try_files /privacy.html =404;
    }

    # nginx no conoce la extension .md, asi que default_type la resuelve
    location ~ \.md$ {
        default_type text/markdown;
        add_header Vary "Accept, Accept-Encoding" always;
        try_files $uri =404;
    }

    # Unica ruta de la SPA con parametro: la ficha de cada inmueble
    location ~ ^/propiedad/[^/]+/?$ {
        try_files /index.html =404;
    }

    # Cualquier otra ruta: archivo real o 404 real (nunca el shell de la SPA)
    location / {
        try_files $uri $uri/ =404;
    }

    # Pagina 404 propia, con punteros a /sitemap.xml y /llms.txt
    error_page 404 /404.html;

    location = /404.html {
        add_header Vary "Accept, Accept-Encoding" always;
    }
}
